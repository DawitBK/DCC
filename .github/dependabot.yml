version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates go to develop first, like every other change (CLAUDE.md, rule 7). Never straight to main.
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node version we run (22). Take security fixes within 22, not new majors.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 cannot be installed next to typescript-eslint yet (peer dependency conflict). Revisit on purpose.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
