# The operational engine: Postiz at the release pinned in VERSION, for a developer computer or a test host.
# Taken from upstream docker-compose.yaml at tag v2.25.3; every difference is listed in CUSTOMIZATIONS.md.
#
# Start:  docker compose -f compose.postiz.yml --env-file postiz.env up -d      (from operational-engine/)
# Stop:   docker compose -f compose.postiz.yml --env-file postiz.env down       (add -v to also delete its data)
#
# Values come from postiz.env (copy postiz.env.example; never committed). The defaults below are
# development placeholders only and must not be used on a shared host.
name: dcc-engine

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:${POSTIZ_VERSION:-v2.25.3}
    restart: unless-stopped
    environment:
      MAIN_URL: ${MAIN_URL:-http://localhost:4007}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4007}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4007/api}
      BACKEND_INTERNAL_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-a-secret-change-me}
      DATABASE_URL: postgresql://postiz:${POSTIZ_DB_PASSWORD:-dev-only-password}@postiz-postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      # Only engine administrators get an account. Open it for the first account, then close it again.
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-true}
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      # Without HTTPS (a developer computer) the sign-in cookie needs this. Never set it on a real host.
      NOT_SECURED: ${NOT_SECURED:-false}
      X_API_KEY: ${X_API_KEY:-}
      X_API_SECRET: ${X_API_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      # Loopback only: DCC reaches the engine on this computer; nobody else does.
      - '127.0.0.1:${POSTIZ_PORT:-4007}:5000'
    networks: [engine]
    depends_on:
      postiz-postgres: { condition: service_healthy }
      postiz-redis: { condition: service_healthy }
      temporal: { condition: service_started }

  postiz-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD:-dev-only-password}
      POSTGRES_DB: postiz
    volumes:
      - postiz-db:/var/lib/postgresql/data
    networks: [engine]
    healthcheck:
      test: pg_isready -U postiz -d postiz
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2
    restart: unless-stopped
    volumes:
      - postiz-redis:/data
    networks: [engine]
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-es:/usr/share/elasticsearch/data
    networks: [engine]

  temporal-postgresql:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD:-dev-only-password}
    volumes:
      - temporal-db:/var/lib/postgresql/data
    networks: [engine]

  temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    depends_on: [temporal-postgresql, temporal-elasticsearch]
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD:-dev-only-password}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    networks: [engine]

volumes:
  postiz-config:
  postiz-uploads:
  postiz-db:
  postiz-redis:
  temporal-es:
  temporal-db:

networks:
  engine:
