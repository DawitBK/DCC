# Local development infrastructure for DCC. Run from the repo root:  npm run infra:up
#
# Deliberately tiny: ONE PostgreSQL. DCC keeps sessions and its queue-free workflows in Postgres,
# so no Redis and no message broker exist until a real requirement needs them (ADR-0004).
# Postiz is NOT in this file: it has its own stack (see operational-engine/README.md).
#
# The superuser password comes from .env (copy .env.example). It is only used by `npm run db:bootstrap`.
name: dcc-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DCC_PG_ADMIN_PASSWORD:?copy .env.example to .env first}
    ports:
      # Loopback only. 5436 so it never collides with a native PostgreSQL on 5432.
      - '127.0.0.1:${DCC_DB_PORT:-5436}:5432'
    volumes:
      - dcc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dcc-pgdata:
